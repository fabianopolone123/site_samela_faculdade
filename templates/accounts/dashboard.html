{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEEVY - UFSCar | Painel</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="dashboard-body">
    <main class="dashboard-centered-shell">
        <section class="dashboard-welcome-card">

            <div class="dashboard-welcome-header">
                <span class="eyebrow">Portal NEEVY - UFSCar</span>
                <h1>Bem-vindo</h1>
                <p class="dashboard-welcome-user">
                    Conectado como <strong>{{ request.user.login_name|default:request.user.email }}</strong>
                </p>
            </div>

            <div class="dashboard-divider"></div>

            <div class="dashboard-nav-actions">
                <a href="{% url 'budget_product_create' %}" class="dashboard-nav-item">
                    <span class="dashboard-nav-icon">📋</span>
                    <div>
                        <strong>Cadastrar</strong>
                        <small>Registrar custos e orçamentos</small>
                    </div>
                </a>
                <a href="{% url 'budget_ready' %}" class="dashboard-nav-item">
                    <span class="dashboard-nav-icon">📊</span>
                    <div>
                        <strong>Orçamento pronto</strong>
                        <small>Visualizar resumo do orçamento</small>
                    </div>
                </a>
            </div>

            <div class="dashboard-divider"></div>

            <a href="{% url 'logout' %}" class="dashboard-logout-link">Sair da conta</a>
        </section>
    </main>
</body>
</html>
