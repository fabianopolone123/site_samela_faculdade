{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEEVY - UFSCar | Painel</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="dashboard-body">
    <main class="dashboard-shell dashboard-shell-centered">
        <section class="dashboard-card dashboard-card-centered">
            <h2>Bem-vindo</h2>
            <p><strong>Usuário:</strong> {{ request.user.login_name|default:request.user.email }}</p>
            <div class="dashboard-actions">
                <a href="{% url 'budget_product_create' %}" class="button-primary">Cadastrar custos</a>
                <a href="{% url 'budget_ready' %}" class="button-secondary dashboard-secondary">Acessar orçamento pronto</a>
            </div>
            <a href="{% url 'logout' %}" class="button-primary logout-link">Sair</a>
        </section>
    </main>
</body>
</html>
